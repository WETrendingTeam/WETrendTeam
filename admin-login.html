<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#4f46e5">

<title>WETrendingTeam Admin Login</title>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
background: #f4f7fb;
color: #172033;

display: flex;
align-items: center;
justify-content: center;

padding: 20px;
}

.login-card {
width: 100%;
max-width: 500px;

background: #ffffff;

border: 1px solid #e5e7eb;
border-radius: 20px;

padding: 36px;

box-shadow: 0 18px 50px rgba(15, 23, 42, 0.10);
}

.login-header {
text-align: center;
margin-bottom: 30px;
}

.login-header h1 {
font-size: 30px;
line-height: 1.2;
color: #172033;
margin-bottom: 10px;
}

.login-header p {
color: #667085;
font-size: 15px;
line-height: 1.5;
}

.field {
margin-bottom: 20px;
}

.field label {
display: block;
font-weight: 700;
font-size: 15px;
color: #344054;
margin-bottom: 8px;
}

.field input {
width: 100%;
height: 54px;

border: 1px solid #cbd5e1;
border-radius: 12px;

padding: 0 16px;

font-size: 16px;

outline: none;

background: #ffffff;
color: #172033;

transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus {
border-color: #4f46e5;
box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.password-wrap {
position: relative;
}

.password-wrap input {
padding-right: 70px;
}

.toggle-password {
position: absolute;

right: 10px;
top: 50%;

transform: translateY(-50%);

border: none;
background: transparent;

color: #667085;

font-size: 14px;
font-weight: 700;

cursor: pointer;

padding: 8px;
}

.toggle-password:hover {
color: #4f46e5;
}

.remember-row {
display: flex;
align-items: center;
gap: 9px;

margin-bottom: 22px;

color: #475467;
font-size: 15px;
}

.remember-row input {
width: 18px;
height: 18px;
cursor: pointer;
}

.login-button {
width: 100%;
height: 54px;

border: none;
border-radius: 12px;

background: #4f46e5;
color: #ffffff;

font-size: 17px;
font-weight: 700;

cursor: pointer;

transition: opacity 0.2s, transform 0.15s;
}

.login-button:hover {
opacity: 0.92;
}

.login-button:active {
transform: scale(0.99);
}

.login-button:disabled {
opacity: 0.65;
cursor: not-allowed;
}

#adminLoginStatus {
min-height: 24px;

margin-top: 16px;

text-align: center;

font-size: 14px;
line-height: 1.5;

color: #475467;
}

.reset {
display: block;

margin: 18px auto 0;

border: none;
background: transparent;

color: #4f46e5;

font-size: 15px;
font-weight: 700;

cursor: pointer;
}

.reset:hover {
text-decoration: underline;
}

.footer-note {
text-align: center;

color: #98a2b3;

font-size: 12px;

margin-top: 28px;
}

@media (max-width: 600px) {
body {
padding: 14px;
}

.login-card {
padding: 28px 22px;
}

.login-header h1 {
font-size: 27px;
}
}
</style>
</head>

<body>

<main class="login-card">

<header class="login-header">
<h1>WETrendingTeam Admin</h1>

<p>
Sign in to access the Admin Panel.
</p>
</header>


<form
id="adminLoginForm"
autocomplete="on"
>

<div class="field">

<label for="adminEmail">
Admin Email
</label>

<input
type="email"
id="adminEmail"
name="email"
placeholder="Enter admin email"
autocomplete="username"
required
>

</div>


<div class="field">

<label for="adminPassword">
Password
</label>

<div class="password-wrap">

<input
type="password"
id="adminPassword"
name="password"
placeholder="Enter password"
autocomplete="current-password"
required
>

<button
type="button"
id="togglePassword"
class="toggle-password"
aria-label="Show password"
>
Show
</button>

</div>

</div>


<label class="remember-row">

<input
type="checkbox"
id="rememberMe"
name="rememberMe"
>

<span>Remember me</span>

</label>


<button
type="submit"
id="adminLoginButton"
class="login-button"
>
Login
</button>


<div
id="adminLoginStatus"
aria-live="polite"
></div>

</form>


<button
type="button"
id="adminResetLink"
class="reset"
>
Reset Password
</button>


<div class="footer-note">
WETrendingTeam Control Center
</div>

</main>


<!--
Firebase is loaded by admin-login.js.
Do not add Firebase Compat scripts here.
-->

<script type="module" src="admin-login.js"></script>


<script>
const passwordInput =
document.getElementById("adminPassword");

const togglePassword =
document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

const isPassword =
passwordInput.type === "password";

passwordInput.type =
isPassword ? "text" : "password";

togglePassword.textContent =
isPassword ? "Hide" : "Show";

togglePassword.setAttribute(
"aria-label",
isPassword
? "Hide password"
: "Show password"
);

});
</script>

</body>
</html>
