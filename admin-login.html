<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WETrendingTeam — Admin Login</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Arial, sans-serif;
background: #f4f7fb;
color: #172033;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}

.login-card {
width: 100%;
max-width: 430px;
background: #ffffff;
border-radius: 18px;
padding: 35px;
box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
}

.logo {
width: 75px;
height: 75px;
object-fit: contain;
display: block;
margin: 0 auto 18px;
border-radius: 16px;
}

h1 {
text-align: center;
margin: 0 0 8px;
font-size: 26px;
}

.subtitle {
text-align: center;
color: #667085;
margin: 0 0 28px;
font-size: 14px;
}

label {
display: block;
margin-bottom: 8px;
font-weight: 600;
font-size: 14px;
}

.field {
margin-bottom: 18px;
}

input[type="email"],
input[type="password"],
input[type="text"] {
width: 100%;
padding: 13px 14px;
border: 1px solid #d0d5dd;
border-radius: 10px;
font-size: 15px;
outline: none;
}

input:focus {
border-color: #635bff;
box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
}

.password-wrap {
position: relative;
}

.password-wrap input {
padding-right: 75px;
}

#togglePassword {
position: absolute;
right: 10px;
top: 50%;
transform: translateY(-50%);
border: 0;
background: transparent;
color: #635bff;
cursor: pointer;
font-weight: 600;
}

.remember-row {
display: flex;
align-items: center;
gap: 8px;
margin-bottom: 20px;
font-size: 14px;
color: #475467;
}

.remember-row input {
width: 16px;
height: 16px;
}

#adminLoginButton {
width: 100%;
padding: 14px;
border: 0;
border-radius: 10px;
background: #635bff;
color: white;
font-size: 16px;
font-weight: 700;
cursor: pointer;
}

#adminLoginButton:hover {
background: #5148e8;
}

#adminLoginButton:disabled {
opacity: 0.65;
cursor: not-allowed;
}

#adminResetLink {
display: block;
margin: 18px auto 0;
border: 0;
background: transparent;
color: #635bff;
cursor: pointer;
font-size: 14px;
}

#adminLoginStatus {
min-height: 22px;
margin-top: 18px;
text-align: center;
font-size: 14px;
}

.footer {
text-align: center;
margin-top: 25px;
color: #98a2b3;
font-size: 12px;
}
</style>
</head>

<body>

<main class="login-card">

<!--
If you have a WETrendingTeam logo inside the images folder,
you can use it here.

Example:
<img src="./images/hitz-logo.png" ...>
-->

<h1>WETrendingTeam</h1>

<p class="subtitle">
Admin Panel Login
</p>


<!-- ==========================================
LOGIN FORM
========================================== -->

<form id="adminLoginForm">

<div class="field">
<label for="adminEmail">
Admin Email
</label>

<input
type="email"
id="adminEmail"
name="email"
placeholder="Enter admin email"
autocomplete="username"
required
>
</div>


<div class="field">

<label for="adminPassword">
Password
</label>

<div class="password-wrap">

<input
type="password"
id="adminPassword"
name="password"
placeholder="Enter password"
autocomplete="current-password"
required
>

<button
type="button"
id="togglePassword"
aria-label="Show password"
>
Show
</button>

</div>

</div>


<label class="remember-row">

<input
type="checkbox"
id="rememberMe"
checked
>

<span>
Remember me
</span>

</label>


<button
type="submit"
id="adminLoginButton"
>
Login
</button>


<button
type="button"
id="adminResetLink"
>
Forgot password?
</button>


<div id="adminLoginStatus"></div>

</form>


<div class="footer">
WETrendingTeam Admin Panel
</div>

</main>


<!-- ==========================================
PASSWORD SHOW / HIDE
========================================== -->

<script>

const togglePassword =
document.getElementById("togglePassword");

const passwordInput =
document.getElementById("adminPassword");


togglePassword.addEventListener(
"click",
function () {

const isPassword =
passwordInput.type === "password";


passwordInput.type =
isPassword
? "text"
: "password";


togglePassword.textContent =
isPassword
? "Hide"
: "Show";


togglePassword.setAttribute(
"aria-label",
isPassword
? "Hide password"
: "Show password"
);

}
);

</script>


<!-- ==========================================
ADMIN LOGIN JAVASCRIPT
ONLY ONE REFERENCE
========================================== -->

<script
type="module"
src="./admin-login.js"
></script>

</body>
</html>
